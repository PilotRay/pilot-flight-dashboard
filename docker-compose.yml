services:
  flight-dashboard:
    image: docker.m.daocloud.io/python:3.11-slim
    container_name: flight-dashboard
    ports:
      - "5101:5101"
    volumes:
      # 修改下方路径：把 /home/你的用户名 换成你自己的 NAS 路径
      - /home/你的用户名/hermes/flight-dashboard/通用模板/backend/app.py:/app/app.py:ro
      - /home/你的用户名/hermes/flight-dashboard/通用模板/backend/extract.py:/app/extract.py:ro
      - /home/你的用户名/hermes/flight-dashboard/通用模板/pilot-config.json:/app/pilot-config.json:ro
      - /home/你的用户名/hermes/flight-dashboard/通用模板/frontend/dist:/app/frontend/dist:ro
      - /home/你的用户名/hermes/flight-dashboard/data:/app/data
    environment:
      - PORT=5101
      - CONFIG_PATH=/app/pilot-config.json
      - DB_PATH=/app/data/flights.db
    command: >
      sh -c "pip install flask flask-cors -q && python /app/app.py"
    restart: unless-stopped
